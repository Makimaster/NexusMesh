[project]
name = "nexusmesh-backend"
version = "0.1.0"
description = "NexusMesh — Nexus Multi-Agent Collaboration Platform (Backend)"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.34.*",
    "pydantic==2.10.*",
    "pydantic-settings==2.*",
    "sqlalchemy==2.0.*",
    "alembic==1.14.*",
    "asyncpg==0.30.*",
    "redis==5.*",
    "litellm==1.50.*",
    "PyJWT[crypto]==2.10.*",
    "bcrypt==4.2.*",
    "email-validator==2.*",
    "httpx==0.28.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "httpx",
    "ruff==0.8.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
