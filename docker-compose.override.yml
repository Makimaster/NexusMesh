# 本地开发叠加配置 — 自动与 docker-compose.yml 合并
# 用途：源码挂载 + 热重载 + 端口对外暴露（便于 GUI 工具连接）

services:
  backend:
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_DEBUG: "true"
      LOG_LEVEL: "DEBUG"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

volumes:
  backend_venv:
