name: nexusmesh

# 用法：
#   完整启动（含 docker 后端，供使用者部署）： docker compose up -d
#   仅起依赖（本地 .venv 跑后端时）：          docker compose up -d postgres redis

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexusmesh-backend:latest
    container_name: nexusmesh-backend
    restart: unless-stopped
    env_file: .env
    # 覆盖 .env 中的 HOST：.env 默认写 localhost 供本地开发，
    # docker 后端在容器网络内需走服务名互访。
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexusmesh-network

  postgres:
    image: postgres:17-alpine
    container_name: nexusmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusmesh-network

  redis:
    image: redis:7.4-alpine
    container_name: nexusmesh-redis
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusmesh-network

  # ─── Phase 3：取消注释启用 MinIO ─────────────────
  # minio:
  #   image: minio/minio:RELEASE.2025-xx  # 替换为具体 tag
  #   container_name: nexusmesh-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
  #     MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
  #   volumes:
  #     - minio_data:/data
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   networks:
  #     - nexusmesh-network

  # ─── 后期：取消注释启用 Nginx ─────────────────────
  # nginx:
  #   image: nginx:1.26-alpine
  #   container_name: nexusmesh-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - nexusmesh-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # minio_data:
  #   driver: local

networks:
  nexusmesh-network:
    driver: bridge
